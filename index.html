<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBite Cafe — Digital Menu</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Table Number Selection Modal -->
  <div class="modal-overlay" id="tableModal">
    <div class="modal-card">
      <div class="modal-icon">🍽️</div>
      <h2>Welcome to QuickBite</h2>
      <p>Please enter your table number to start placing orders.</p>
      <input 
        type="number" 
        id="tableInput" 
        placeholder="Enter Table No. (1-13)" 
        min="1" 
        max="13" 
        autofocus 
        />
      <button class="primary-btn" onclick="saveTableNumber()">Confirm Table</button>
    </div>
  </div>

  <header class="navbar">
    <div class="logo">QuickBite<span>.</span></div>
    <button class="table-badge unassigned" id="tableBadge" onclick="openTableModal()">
      <span>Table:</span> <strong id="tableBadgeText">Not Set</strong>
    </button>
  </header>

  <main class="container">
    <section class="hero">
      <p class="sub-heading">Freshly Brewed & Handcrafted</p>
      <h1>Select your items and order instantly.</h1>
    </section>

    <!-- Category Tabs -->
    <nav class="categories">
      <button class="cat-btn active" onclick="filterCategory('all', this)">All</button>
      <button class="cat-btn" onclick="filterCategory('coffee', this)">Coffee</button>
      <button class="cat-btn" onclick="filterCategory('bakery', this)">Bakery</button>
      <button class="cat-btn" onclick="filterCategory('fastfood', this)">Fast Food</button>
    </nav>

    <!-- Menu Items Grid -->
    <div class="menu-grid" id="menuGrid">
      <!-- Generated by JavaScript -->
    </div>
  </main>

  <!-- Floating Cart Drawer -->
  <div class="cart-bar" id="cartBar">
    <div class="cart-info">
      <span id="cartCount">0 items</span>
      <span class="dot">•</span>
      <span id="cartTotal">₹0</span>
    </div>
    <button class="checkout-btn" onclick="placeOrder()">Place Order →</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
