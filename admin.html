<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBite — Kitchen Display</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

  <header class="navbar">
    <div class="logo">QuickBite <span>Kitchen KDS</span></div>
    <a href="index.html" class="nav-link">View Menu</a>
  </header>

  <main class="container">
    <div class="dashboard-header">
      <h2>Live Order Queue</h2>
      <button class="clear-btn" onclick="clearOrders()">Clear All Orders</button>
    </div>

    <div class="orders-grid" id="ordersContainer">
      <!-- Live orders dynamically populate here -->
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    // Auto-load kitchen dashboard orders
    window.onload = loadKitchenDashboard;
  </script>
</body>
</html>
